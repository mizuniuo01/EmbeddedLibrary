# 项目唯一的工程规范入口。
# 复制到项目 docs/ENGINEERING_PROFILE.yaml 后，按项目事实修改。
profile:
  name: embedded-mcu-default
  version: 1

language:
  c:
    standard: c11
    references:
      - name: BARR-C:2018
        url: https://barrgroup.com/embedded-c-coding-standard
      - name: Linux Kernel Coding Style
        url: https://www.kernel.org/doc/html/latest/process/coding-style.html
  cpp:
    enabled: true
    standard: c++17
    references:
      - name: BARR-C:2018 embedded principles
        url: https://barrgroup.com/embedded-c-coding-standard
      - name: Google C++ Style Guide
        url: https://google.github.io/styleguide/cppguide
      - name: C++ Core Guidelines
        url: https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines
    embedded_constraints:
      exceptions: disabled
      rtti: disabled
      dynamic_allocation: restricted
      realtime_path: no_blocking

architecture:
  references:
    - name: ISO/IEC/IEEE 42010
      url: https://www.iso.org/standard/74393.html
    - name: FreeRTOS documentation
      url: https://www.freertos.org/Documentation/00-Overview
  execution_models:
    - bare_metal
    - freertos
  layers:
    - composition_root
    - application
    - domain
    - services
    - libraries
    - middleware
    - bsp
    - drivers
  personal_rules:
    layering: required
    interfaces: caller_oriented_minimal
    interface_contract:
      - lifecycle
      - ownership
      - parameter_direction
      - blocking_context
      - concurrency
      - errors

rtos:
  name: freertos
  version: project_defined
  port: project_defined

personal_rules:
  line_width: 100
  indentation_spaces: 4
  tab_width: 4
  insert_tabs: false
  function_call_parenthesis_space: false
  control_keyword_parenthesis_space: true
  switch_case_extra_indent: true
  long_arguments: linux_open_parenthesis_alignment
  comments:
    language: zh
    style: linux_kernel
    public_api: kernel_doc_when_needed
  naming:
    c: module_prefixed_snake_case
    type: module_role_t
    module_prefix_abbreviation: conditional_with_five_checks
    pointer_declaration: star_adjacent_to_name
  expressions:
    operator_spacing: barr_c_linux
    extra_parentheses_in_complex_conditions: true
  functions:
    max_lines_default: 100
    return_style: barr_c_single_exit_preferred

project:
  target_mcus: []
  toolchain: {}
  abi: project_defined
  exceptions: []
